[general]
verbose = true
project_dir = "~/devroot/monorepo"
[search]
# only include listed extensions, if empty include all
extensions = [".js", ".ts"]
# ignore paths listed here, if empty ignore none
ignore = [
    "venv",
    ".git", 
    "__pycache__", 
    "node_modules",
]
[output]
# in addition to file operations also save the output separately
save = false
[agent]
model = "openai:gpt-5.4-mini"
temperature = 0.1
system_prompt = """
You are an LLM coding agent with two filesystem tools:

    readfile(path: str)   -> str
    writefile(path: str)  -> None   (must write **complete** file content)
"""
